<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>Fliperama CIABA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: uma coluna de fliperama (máx. 560px): letreiro, cartão do jogador, abas fixas (Jogos, Galera, Ranking, Personagem, Painel)
   e a área da aba. Visual único escuro de propósito (tela de arcade à noite), com cores explícitas. */
:root{
  --bg:#0a0f1e; --bg2:#111a30; --card:#16213d; --card2:#1d2b4f; --line:#2c3d6b;
  --fg:#eef2ff; --muted:#93a0c4; --aura:#ffb423; --sea:#34d1e0; --ok:#3ddc84; --bad:#ff5470; --neon:#ff4fd8;
  --f-disp:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;background:radial-gradient(900px 500px at 50% -180px,#2a1a5e 0%,var(--bg) 62%) fixed,var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:grid;gap:14px}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
button{font:inherit}
.letreiro{text-align:center;display:grid;gap:2px}
.letreiro h1{font-family:var(--f-disp);font-size:30px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--aura);text-shadow:0 0 18px #ffb42366,0 0 2px #fff6;line-height:1.1}
.letreiro .neon{color:var(--neon);font-family:var(--f-disp);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.small{font-size:13px;color:var(--muted)}
.tit{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.05em;font-size:18px;margin:0 0 8px;text-wrap:balance}
.tit2{font-family:var(--f-disp);font-size:16px}
input{width:100%;border-radius:10px;background:var(--bg2);color:var(--fg);border:1px solid var(--line);padding:11px 12px;font:inherit;min-width:0}
.rec{display:grid;gap:6px;font-size:14px}
.rec div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.rec b{font-family:var(--f-disp);color:var(--aura);font-variant-numeric:tabular-nums;text-align:right}
/* jogador */
.jog{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px}
.jog-av{width:72px;height:80px;border-radius:12px;overflow:hidden;border:2px solid var(--neon);box-shadow:0 0 14px #ff4fd844;background:#0b1e33}
.jog-av svg,.prev svg{display:block;width:100%;height:100%}
.jog-dir{display:grid;gap:4px;min-width:0}
.jog-nome{background:none;border:0;color:var(--fg);font-family:var(--f-disp);font-size:20px;text-align:left;padding:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aura{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:18px;color:var(--aura);font-variant-numeric:tabular-nums}
.aura small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.status{font-size:12px;color:var(--muted)}.status.on{color:var(--ok)}
/* abas */
.abas{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;background:linear-gradient(var(--bg) 80%,transparent);scrollbar-width:none}
.aba{flex:none;position:relative;min-height:42px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-family:var(--f-disp);font-size:13px;cursor:pointer}
.aba.sel{background:var(--aura);border-color:var(--aura);color:#2a1600;font-weight:700}
.bolha{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.bt{min-height:44px;border-radius:12px;border:2px solid var(--neon);background:#2a0f2a;color:#ffd6f5;font-weight:700;font-family:var(--f-disp);cursor:pointer;padding:0 12px}
.bt.sec{border-color:var(--line);background:var(--card2);color:var(--fg)}
.bt:disabled,.fl-btn:disabled{opacity:.45;cursor:default}
.google{border-color:#4285f4;background:#0f1d3a;color:#dbe7ff;justify-self:start}
.bt.perigo{border-color:var(--bad);color:#ffd0d8}
.aviso{margin:0;padding:10px 12px;border-radius:12px;background:#3a1422;border:1px solid var(--bad);color:#ffd0d8}
/* jogos em grupo */
.grp{display:grid;gap:10px}
.gmenu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gmenu>.gjogo:last-child:nth-child(odd){grid-column:1/-1}
.gjogo{display:grid;gap:6px;align-content:start;padding:14px;border-radius:18px;border:2px solid color-mix(in srgb,var(--c1) 55%,transparent);background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c1) 30%,transparent),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--c2) 45%,#0d1630),#0d1630);box-shadow:0 6px 18px color-mix(in srgb,var(--c2) 30%,transparent);min-width:0}
.gjogo b{font-family:var(--f-disp);font-size:17px;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.gjogo span:not(.fl-ic){font-size:13px;color:#c9d2ee}
.gjogo em{font-style:normal;font-family:var(--f-disp);color:var(--c1);font-size:14px}
.gbts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.gbts .fl-btn{min-height:42px;font-size:13px;padding:0 4px}
.codigo{display:flex;gap:8px}
.salas{display:grid;gap:8px;margin-top:8px}
.sala{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--ok);background:#0f2a22;color:var(--fg);text-align:left;cursor:pointer;min-width:0}
.sala span{display:grid;flex:1;min-width:0}.sala small{color:var(--muted)}
.sala em{font-style:normal;font-family:var(--f-disp);color:var(--ok)}
.cod{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:none}
.codbig{font-family:var(--f-disp);font-size:22px;color:var(--aura);letter-spacing:.06em}
.gplacar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.gp{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px}
.gp i{font-style:normal;color:var(--muted);font-family:var(--f-disp)}.gp b{font-family:var(--f-disp);color:var(--aura)}
.gp.eu{border-color:var(--neon)}.gp.dest{background:#0f3a28;border-color:var(--ok)}
.gtimer{font-family:var(--f-disp);color:#eef2ff;font-variant-numeric:tabular-nums}.gtimer.urg{color:var(--bad)}
/* quiz */
.roleta{position:relative;display:grid;justify-items:center;gap:12px;padding:10px 0}
.roleta::before{content:"";position:absolute;top:0;left:50%;margin-left:-12px;border:12px solid transparent;border-top:20px solid #fff;z-index:2;filter:drop-shadow(0 2px 2px #0008)}
.roda{position:relative;width:200px;height:200px;border-radius:50%;background:conic-gradient(#ffd23f 0 14.28%,#ff4fd8 0 28.57%,#3ff0ff 0 42.85%,#7dff6a 0 57.14%,#5ad1ff 0 71.42%,#ff8a3d 0 85.71%,#b06cff 0);border:6px solid #fff;box-shadow:0 0 30px #7b2ff788;animation:gira 2.2s cubic-bezier(.2,.7,.2,1) forwards;--fim:0;max-width:100%}
.roda span{position:absolute;left:50%;top:50%;font-size:22px;transform:rotate(calc((var(--i) + .5) * 51.43deg)) translateY(-70px) rotate(calc((var(--i) + .5) * -51.43deg));margin:-14px 0 0 -14px}
@keyframes gira{from{transform:rotate(0)}to{transform:rotate(calc(1440deg - (var(--fim) + .5) * 51.43deg))}}
.cat-sai,.qcat{font-family:var(--f-disp);font-size:20px;color:var(--c);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.cat-sai{animation:aparece .3s 2.1s both}
@keyframes aparece{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.qperg{font-size:19px;font-weight:700;text-align:center;padding:16px 12px;border-radius:16px;background:#0b1122;border:2px solid var(--c1);text-wrap:balance}
.qops{display:grid;gap:8px}
.qop{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:linear-gradient(180deg,#22325c,#16213d);color:var(--fg);font-size:16px;text-align:left;cursor:pointer;box-shadow:0 3px 0 #0a0f1e}
.qop i{font-style:normal;font-family:var(--f-disp);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--c1);color:#1a0b33;flex:none}
.qop.sel{border-color:var(--aura)}.qop.ok{border-color:var(--ok);background:#0f3a28}.qop.no{border-color:var(--bad);background:#3a1422}
.qop:disabled{cursor:default}
/* tiro */
.tperg{font-size:18px;font-weight:700;text-align:center;padding:10px 12px;border-radius:14px;background:#0b1122;border:2px solid var(--c1);min-height:52px;text-wrap:balance}
.tcampo{border-radius:16px;overflow:hidden;border:2px solid color-mix(in srgb,var(--c1) 60%,transparent);background:radial-gradient(circle at 50% 40%,#1d1242,#0a0620);touch-action:manipulation}
.tcampo canvas{display:block;width:100%;height:min(380px,58vh);cursor:crosshair}
/* forca em equipe e stop */
.vez{text-align:center;margin:0;color:var(--muted)}.vez.minha{color:var(--ok);font-family:var(--f-disp);font-size:18px}
.letra{font-size:24px;color:var(--aura)}
.stopf{display:grid;gap:4px}.stopf label{margin-top:6px}
.stopbt{background:linear-gradient(180deg,#ff5470,#c2185b);box-shadow:0 4px 0 #7a0f39;color:#fff}
.stopv{display:grid;gap:10px}
.sv{display:grid;gap:4px;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.sv>b{font-family:var(--f-disp);font-size:14px;color:var(--c1)}
.svr{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.svr.eu .svn{color:var(--neon)}
.svn{width:90px;flex:none;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svt{flex:1;min-width:0;overflow-wrap:anywhere}
.svr em{font-style:normal;font-family:var(--f-disp);color:var(--aura)}
.xv{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);opacity:.5;cursor:pointer}.xv.on{opacity:1;border-color:var(--bad);background:#3a1422}
/* chat */
.chat{display:grid;gap:10px}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.online{display:flex;flex-wrap:wrap;gap:6px}
.on-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:#0f2a22;border:1px solid #1f6b4f}
.on-chip i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.msgs{height:min(52vh,440px);overflow-y:auto;display:grid;align-content:start;gap:10px;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px}
.m-av{width:36px;height:40px;border-radius:9px;overflow:hidden;background:#0b1e33;display:block}.m-av svg{width:100%;height:100%;display:block}
.m-corpo b{font-family:var(--f-disp);font-size:14px}.msg.eu .m-corpo b{color:var(--neon)}
.m-corpo time{font-size:11px;color:var(--muted)}
.m-corpo p{margin:2px 0 0;overflow-wrap:anywhere}
.m-mod{display:flex;gap:6px;margin-top:4px}.m-mod button{font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--muted);padding:3px 8px;cursor:pointer}
.fchat{display:flex;gap:8px}
/* ranking */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-size:14px;cursor:pointer}
.chip.sel{background:var(--neon);border-color:var(--neon);color:#2a0020;font-weight:700}
.podio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pod{display:grid;justify-items:center;gap:4px;text-align:center;min-width:0}
.pod b{font-family:var(--f-disp);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod span{font-size:13px;color:var(--aura);font-family:var(--f-disp)}
.pod-av{width:64px;height:70px;border-radius:12px;overflow:hidden;background:#0b1e33;border:2px solid var(--line)}.pod-av svg{width:100%;height:100%;display:block}
.p1 .pod-av{width:80px;height:88px;border-color:#ffd23f;box-shadow:0 0 18px #ffd23f66}
.pod.eu b{color:var(--neon)}
.degrau{width:100%;border-radius:10px 10px 0 0;font-family:var(--f-disp);font-size:20px;display:grid;place-items:center;color:#1a1200}
.p1 .degrau{height:64px;background:linear-gradient(#ffe066,#c9962b)}.p2 .degrau{height:46px;background:linear-gradient(#e6edf5,#9aa7b8)}.p3 .degrau{height:34px;background:linear-gradient(#f0a868,#a0602b)}
.podio.mini .degrau{height:auto;padding:4px 0}
.rk{margin:0;padding-left:28px;display:grid;gap:6px}
.rk li{padding:6px 10px;border-radius:10px;background:var(--bg2);display:flex;justify-content:space-between;gap:8px}
.rk li.eu{border:1px solid var(--neon)}.rk b{font-family:var(--f-disp);color:var(--aura)}
/* personagem */
.loja{display:grid;gap:12px}
.loja-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prev{width:min(230px,70vw);aspect-ratio:200/220;max-width:100%;margin:0 auto;border-radius:18px;overflow:hidden;border:2px solid var(--neon);box-shadow:0 0 24px #ff4fd855}
.base{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shop-it{display:grid;gap:4px;justify-items:center;text-align:center;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--fg);font-size:13px;line-height:1.2;cursor:pointer;min-width:0}
.shop-it.usa{border-color:var(--ok)}.shop-it.prova{border-color:var(--aura)}
.shop-it em{font-style:normal;font-family:var(--f-disp);color:var(--aura);font-size:13px}.shop-it em.tem{color:var(--ok)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #0006}
.comprar{display:grid;gap:6px;padding:12px;border-radius:14px;background:#2a1f05;border:1px solid var(--aura);text-align:center}
.ganho{font-family:var(--f-disp);color:var(--aura);font-size:20px}
/* painel */
.painel{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.pl .small{overflow-wrap:anywhere}
.pl-bts,.pl-conf{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pl-bts .bt,.pl-conf .bt{min-height:38px;font-size:13px}
.regras{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.regras ul{margin:0;padding-left:18px;display:grid;gap:4px}
.aceito{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}.aceito input{width:22px;height:22px;flex:none}
.convite{display:grid;gap:8px}.convite textarea{width:100%;border-radius:10px;background:var(--bg2);color:var(--fg);border:1px solid var(--line);padding:10px;font:inherit;font-size:14px;resize:vertical}
.zap{display:inline-grid;place-items:center;text-decoration:none;border-color:#1aa85a;color:#c8ffd9}
/* boas-vindas */
.bv-fundo{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:#050814cc;backdrop-filter:blur(3px)}
.bv{width:min(460px,100%);max-height:calc(100vh - 32px);overflow-y:auto;display:grid;gap:12px;padding:18px 16px;border-radius:18px;background:linear-gradient(170deg,#1d1450,#111a30 55%);border:2px solid var(--neon);box-shadow:0 0 30px #ff4fd855}
.bv h2{margin:0;font-family:var(--f-disp);font-size:24px;text-transform:uppercase;letter-spacing:.04em;color:var(--aura);text-align:center;text-shadow:0 0 14px #ffb42366;text-wrap:balance}
.bv-it{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.bv-it>span{font-size:24px;line-height:1.2;text-align:center}
.bv-it p{margin:0;font-size:15px}.bv-it b{font-family:var(--f-disp);color:var(--fg)}
.bv-reg{margin:0;font-size:14px;color:var(--muted);text-align:center}
.bv .bt{width:100%;min-height:50px;font-size:18px}
.bv-abrir{justify-self:center;background:none;border:0;color:var(--sea);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
.como summary{cursor:pointer;font-family:var(--f-disp)}.como ol{display:grid;gap:6px;padding-left:20px}
@media (max-width:400px){.gbts{grid-template-columns:1fr}.svn{width:70px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="pub">
  <header class="letreiro"><span class="neon">jogue · dispute · monte seu personagem</span><h1>Fliperama CIABA</h1></header>
  <section class="card jog">
    <div class="jog-av" id="jogAv"></div>
    <div class="jog-dir"><button class="jog-nome" id="jogNome">Sem apelido</button><span class="aura" id="saldo"></span><span class="status" id="status"></span><span id="conta"></span></div>
  </section>
  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <div id="area" style="display:grid;gap:14px"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
// ================= ADAPTADOR FIREBASE (versão GitHub Pages) =================
// Implementa o mesmo window.claude.use("db" | "user" | "room") que a página usa dentro do Claude,
// mas em cima do Firebase (login com Google + Realtime Database). Cada documento é guardado como
// { j: "<json>", t: hora } para não perder listas vazias (o Realtime Database apaga listas vazias).
(function () {
  const CFG = window.FIREBASE_CONFIG, DONO = (window.FLIPER_DONO || "").toLowerCase();
  window.FLIPER_PLAT = "firebase";
  if (!CFG || !window.firebase) return;
  firebase.initializeApp(CFG);
  const auth = firebase.auth(), rtdb = firebase.database();
  let offset = 0; rtdb.ref(".info/serverTimeOffset").on("value", (s) => { offset = s.val() || 0; });
  const agoraServ = () => Date.now() + offset;
  const pronto = new Promise((res) => { const off = auth.onAuthStateChanged((u) => { off(); res(u); }); });
  const empacota = (d) => ({ j: JSON.stringify(d), t: firebase.database.ServerValue.TIMESTAMP });
  const abre = (v) => { if (!v || typeof v.j !== "string") return undefined; try { return JSON.parse(v.j); } catch (e) { return undefined; } };
  const snapDoc = (id, d) => ({ id, exists: d !== undefined, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } });
  const erro = (e) => ({ code: /permission/i.test(String(e && (e.code || e.message))) ? "invalid_argument" : "unavailable", message: String(e && e.message || e) });

  // ---------- db ----------
  const docRef = (path) => { const r = rtdb.ref(path), id = path.split("/").pop();
    return { id, path,
      get: async () => { try { const s = await r.get(); return snapDoc(id, abre(s.val())); } catch (e) { throw erro(e); } },
      set: async (d) => { try { await r.set(empacota(d)); } catch (e) { throw erro(e); } },
      update: async (d) => { const s = await r.get(); const cur = abre(s.val()); if (!cur) throw { code: "invalid_argument" }; try { await r.set(empacota({ ...cur, ...d })); } catch (e) { throw erro(e); } },
      delete: async () => { try { await r.remove(); } catch (e) { throw erro(e); } },
      onSnapshot: (next, err) => { const h = (s) => next(snapDoc(id, abre(s.val()))); r.on("value", h, (e) => err && err(erro(e))); return () => r.off("value", h); } }; };

  const icone = (k, tam) => { const j = INFO(k); return `<span class="fl-ic" style="--c1:${j.c1};--c2:${j.c2};${tam ? `width:${tam}px;height:${tam}px` : ""}"><svg viewBox="0 0 48 48" aria-hidden="true">${FL_ICON[k]}</svg></span>`; };
  const RANK = ["quiz", "tiro", "duelo", "forcaeq", "stop", "tabuada", "forca", "memoria", "caca", "cruzadas"];
  // aura ganha por partida (só compra itens do personagem)
  const ganhoDe = (jogo, p) => ({ tabuada: p * 4, forca: p * 15, duelo: p * 4, quiz: p / 25, tiro: p / 3, forcaeq: p / 2.5, stop: p / 2 })[jogo] ?? p / 25;
  const BONUS_RECORDE = 20, BONUS_VITORIA = 30;

  // ---------- filtro de palavrões do chat ----------
  const PAL = new Set(["PORRA", "CARALHO", "CARAI", "MERDA", "PUTA", "PUTO", "PUTARIA", "BUCETA", "CU", "CUZAO", "FODA", "FODER", "FODASE", "FODIDO", "VIADO", "ARROMBADO", "DESGRACADO", "DESGRACA", "CACETE", "PIRANHA", "VAGABUNDA", "VAGABUNDO", "VADIA", "OTARIO", "BABACA", "IMBECIL", "RETARDADO", "FDP", "PQP", "VSF", "TNC", "KRL", "CRL", "BOSTA", "CORNO", "ESCROTO", "PIROCA", "ROLA", "XOTA", "PAU NO CU", "BICHA", "MACACO", "PUNHETA", "GOZAR"]);
  const filtra = (t) => t.replace(/[\p{L}\p{N}]+/gu, (w) => PAL.has(flNorm(w)) ? "★".repeat(Math.min(w.length, 5)) : w);

  // ---------- estado ----------
  const S = { modo: "local", uid: null, DB: null, USER: null, ROOM: null, dono: false, perfis: {}, chat: {}, mod: { silenciados: [], apagados: [] }, tab: LS("flp-tab") || "jogos", rk: "quiz", online: [], salas: [], nome: "", cadastro: false };
  let P = null; // meu perfil
  const PADRAO_P = () => ({ apelido: "", av: { ...AV.AV_PADRAO }, aura: 0, gasto: 0, compras: [], recs: {}, vit: {}, partidas: 0 });
  function perfilLocal() {
    let p = LJ("flp-perfil", null);
    if (!p) { // migra o que a versão anterior guardava em chaves soltas
      p = PADRAO_P(); p.apelido = LS("flp-apelido") || ""; p.av = { ...AV.AV_PADRAO, ...LJ("flp-avatar", {}) };
      p.aura = (Number(LS("flp-aura")) || 0); p.gasto = Number(LS("flp-gasto")) || 0; p.compras = LJ("flp-compras", []); p.recs = LJ("flp-recs", {});
    }
    return { ...PADRAO_P(), ...p };
  }
  P = perfilLocal();
  let salvando = false, sujo = false;
  async function salvarPerfil() {
    sujo = true; if (salvando) return; salvando = true;
    while (sujo) { sujo = false; const body = JSON.parse(JSON.stringify(P));
      LS("flp-perfil", JSON.stringify(body));
      if (S.modo === "online") { try { await S.DB.doc("perfis/" + S.uid).set(body); } catch (e) { console.warn("perfil", e && e.code); } } }
    salvando = false;
  }
  const saldo = () => Math.round((P.aura || 0) - (P.gasto || 0));
  const tem = (cat, x) => !x.preco || (P.compras || []).includes(cat + ":" + x.id);
  const meuAp = () => (P.apelido || "Você").trim();
  function registrar(jogo, pts, op = {}) {
    let ganho = Math.round(ganhoDe(jogo, pts)), recorde = false;
    if (!op.semRanking) { const ant = P.recs[jogo] || 0; if (pts > ant && pts > 0) { P.recs = { ...P.recs, [jogo]: pts }; recorde = true; ganho += BONUS_RECORDE; } }
    if (op.venceu) { P.vit = { ...P.vit, [jogo]: (P.vit[jogo] || 0) + 1 }; ganho += BONUS_VITORIA; }
    P.aura = (P.aura || 0) + ganho; P.partidas = (P.partidas || 0) + 1; P.ult = Date.now();
    salvarPerfil(); desenhaJogador();
    return { ganho, recorde };
  }

  // ---------- topo: jogador e abas ----------
  const AVC = new Map();
  const avMini = (av) => { const k = JSON.stringify(av || {}); if (!AVC.has(k)) AVC.set(k, AV.avatarSvg(av || {}, { mini: true })); return AVC.get(k); };
  function desenhaJogador() {
    document.getElementById("jogAv").innerHTML = AV.avatarSvg(P.av);
    document.getElementById("jogNome").textContent = P.apelido || "Sem apelido";
    document.getElementById("saldo").innerHTML = `⚡ ${saldo()} <small>aura</small>`;
    const st = document.getElementById("status");
    st.textContent = S.modo === "online" ? `Conectado${S.nome ? " como " + S.nome : ""} · ranking e chat ligados` : S.modo === "carregando" ? "Conectando…" : "Modo visitante: pontos só neste celular";
    st.className = "status " + (S.modo === "online" ? "on" : "");
    if (FBV) { st.textContent = S.modo === "online" ? `Conectado como ${S.nome || "você"}` : S.modo === "carregando" ? "Conectando…" : "Entre com o Google para o ranking, o chat e as salas";
      const c = document.getElementById("conta"); if (c) { c.innerHTML = S.modo === "online" ? `<button class="fl-link" id="btSair">Sair da conta</button>` : S.modo === "carregando" ? "" : `<button class="bt google" id="btEntrar">Entrar com Google</button>`;
        const e = document.getElementById("btEntrar"); if (e) e.onclick = () => window.FB && FB.entrar().catch(() => { st.textContent = "Não deu para entrar. Tente de novo."; });
        const x = document.getElementById("btSair"); if (x) x.onclick = () => window.FB && FB.sair(); } }
  }
  function desenhaAbas() {
    const abas = [["jogos", "🎮 Jogos"], ["galera", "💬 Galera"], ["ranking", "🏆 Ranking"], ["personagem", "🎨 Visual"]];
    if (S.dono) abas.push(["painel", "🛡️ Painel"]);
    const nao = naoLidas();
    document.getElementById("abas").innerHTML = abas.map(([k, n]) => `<button class="aba ${S.tab === k ? "sel" : ""}" data-tab="${k}">${n}${k === "galera" && nao ? `<span class="bolha">${nao > 9 ? "9+" : nao}</span>` : ""}</button>`).join("");
  }
  document.getElementById("abas").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; if (ENG.ativo) sairMotor(true); if (FL.estado()) FL.fechar(); irPara(b.dataset.tab); });
  document.getElementById("jogNome").addEventListener("click", () => irPara("personagem"));
  function irPara(t) { S.tab = t; LS("flp-tab", t); P2.prova = null; render(); window.scrollTo(0, 0); }
  function render() {
    if (S.banido) return;
    desenhaAbas();
    if (S.cadastro) return telaCadastro();
    if (ENG.ativo) return telaJogo(true);
    if (FL.emJogo()) return;
    ({ jogos: telaJogos, galera: telaGalera, ranking: telaRanking, personagem: telaPersonagem, painel: telaPainel }[S.tab] || telaJogos)();
  }

  // ---------- cadastro (primeira vez com login) ----------
  function telaCadastro() {
    area.innerHTML = `<section class="card loja"><h2 class="tit">Bem-vindo ao Fliperama!</h2>
      <p style="margin:0">${S.nome ? `Você entrou com a conta de <b>${esc(S.nome)}</b>. ` : ""}Escolha como a galera vai te ver no ranking e no chat.</p>
      <div class="prev">${AV.avatarSvg(P.av)}</div>
      <div class="base"><button class="chip ${P.av.base !== "f" ? "sel" : ""}" data-c="base" data-v="m">Masculino</button><button class="chip ${P.av.base === "f" ? "sel" : ""}" data-c="base" data-v="f">Feminino</button></div>
      <label class="small" for="cadAp">Apelido (3 a 16 letras ou números)</label><input id="cadAp" maxlength="16" value="${esc(P.apelido || sugestao())}" autocomplete="off">
      <div class="regras"><b>Regras da galera</b><ul><li>Respeito no chat. Palavrão vira ★★★ e quem pegar pesado é silenciado.</li>${FBV ? "" : "<li>O Fliperama é só para jogar: não altere a página nem peça ao Claude para mudar nada nela.</li>"}<li>Quem desrespeitar ${FBV ? "é banido" : "perde o convite"}.</li></ul><label class="aceito"><input type="checkbox" id="cadOk"> Li e topo as regras</label></div>
      <span class="small" id="cadErr" style="color:var(--bad)"></span>
      <button class="fl-btn" data-c="ok">Entrar no Fliperama</button>
      <p class="small" style="margin:0">Sua aura, seus itens e seus recordes deste celular vêm junto.</p></section>`;
    area.querySelectorAll("[data-c]").forEach((b) => b.onclick = async () => {
      if (b.dataset.c === "base") { P.av = { ...P.av, base: b.dataset.v }; if (b.dataset.v === "f" && P.av.cabelo === "degrade") P.av.cabelo = "longo"; if (b.dataset.v === "m" && P.av.cabelo === "longo") P.av.cabelo = "degrade"; P.apelido = document.getElementById("cadAp").value; return telaCadastro(); }
      const ap = document.getElementById("cadAp").value.trim().replace(/\s+/g, " "), err = document.getElementById("cadErr");
      if (!document.getElementById("cadOk").checked) { err.textContent = "Marque que você topa as regras."; return; }
      if (!/^[\p{L}\p{N} _.-]{3,16}$/u.test(ap)) { err.textContent = "Use de 3 a 16 letras ou números."; return; }
      if (filtra(ap) !== ap) { err.textContent = "Esse apelido não pode. Escolha outro."; return; }
      const usado = Object.entries(S.perfis).some(([id, p]) => id !== S.uid && flNorm(p.apelido || "") === flNorm(ap));
      if (usado) { err.textContent = "Já tem alguém com esse apelido."; return; }
      P.apelido = ap; P.regras = Date.now(); P.criado = P.criado || Date.now(); P.visto = Date.now(); S.cadastro = false;
      await salvarPerfil(); desenhaJogador(); irPara("jogos"); sfx("coin");
    });
  }

  function sugestao() { const n = (S.nome || "").split(/\s+/)[0].replace(/[^\p{L}\p{N}]/gu, "").slice(0, 12); return n.length >= 3 ? n : ""; }
  // ---------- aba Jogos ----------
  function telaJogos() {
    const salas = S.salas.length ? `<section class="card"><b class="tit2">🟢 Salas abertas agora</b><div class="salas">${S.salas.map((s) => `<button class="sala" data-a="entrar" data-v="${esc(s.sala)}">${icone(s.jogo, 34)}<span><b>${esc(INFO(s.jogo)?.n || s.jogo)}</b><small>de ${esc(s.ap || "alguém")} · ${s.n || 1} na sala</small></span><em>Entrar</em></button>`).join("")}</div></section>` : "";
    const lideres = RANK.map((k) => { const l = lider(k); return l ? `<div><span>${esc(INFO(k).n)}</span><b>${esc(l.ap)} · ${l.pts}</b></div>` : ""; }).join("");
    area.innerHTML = `${salas}
      <section class="grp"><h2 class="tit">Jogue com a galera</h2><div class="gmenu">${Object.entries(GJ).map(([k, j]) => `<div class="gjogo" style="--c1:${j.c1};--c2:${j.c2}">${icone(k)}<b>${j.n}</b><span>${j.d}</span><em>🏆 ${P.recs[k] || "—"}</em><div class="gbts"><button class="fl-btn fl-sec" data-a="solo" data-v="${k}">Sozinho</button><button class="fl-btn" data-a="criar" data-v="${k}" ${S.ROOM ? "" : "disabled"}>Criar sala</button></div></div>`).join("")}</div>
      ${S.ROOM ? `<div class="codigo"><input id="codIn" maxlength="20" placeholder="Código da sala (ex.: quiz-k3f9)" autocomplete="off"><button class="bt sec" data-a="codigo">Entrar</button></div>` : `<p class="small">${FBV ? "Para jogar com a galera ao vivo, entre com o Google (botão lá em cima)." : "Jogar com a galera ao vivo precisa do convite e do login com a conta Claude."}</p>`}</section>
      <section><h2 class="tit">Clássicos</h2>${flMenuHtml((k) => `data-jogo="${k}"`, (k) => P.recs[k])}</section>
      ${lideres ? `<section class="card"><b class="tit2">🏆 Líderes</b><div class="rec" style="margin-top:8px">${lideres}</div></section>` : ""}`;
    area.querySelectorAll("[data-jogo]").forEach((b) => b.onclick = () => { FL.abrir(b.dataset.jogo); classico(); });
    area.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => {
      const a = b.dataset.a, v = b.dataset.v;
      if (a === "solo") iniciarSolo(v);
      if (a === "criar") criarSala(v);
      if (a === "entrar") entrarSala(v);
      if (a === "codigo") { const c = (document.getElementById("codIn").value || "").trim().toLowerCase(); if (/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(c)) entrarSala(c); }
    });
  }
  function lider(k) {
    let best = null; for (const [id, p] of Object.entries(S.perfis)) { const v = p.recs?.[k] || 0; if (v > 0 && (!best || v > best.pts)) best = { ap: p.apelido || "Alguém", pts: v, id }; }
    if (S.modo !== "online" && P.recs[k]) best = { ap: meuAp(), pts: P.recs[k] };
    return best;
  }
  function classico() {
    const el = document.createElement("div"); area.innerHTML = ""; area.appendChild(el);
    FL.mount(el, {
      sfx, sair: () => { FL.fechar(); render(); window.scrollTo(0, 0); },
      onFim: (r) => { const g = registrar(r.jogo, r.pontos); r.ganho = g.ganho; r.recorde = g.recorde; },
      extraFim: (r) => `${r.ganho ? `<span class="ganho">+${r.ganho} aura ⚡</span>` : ""}${r.recorde ? `<b style="color:var(--ok);font-family:var(--f-disp);font-size:18px">🏆 Novo recorde!</b>` : ""}${posicao(r.jogo)}`,
      msg: (r) => `${meuAp()} fez ${r.pontos} ${FL_JOGOS[r.jogo].un} no ${FL_JOGOS[r.jogo].n}, no Fliperama CIABA. Duvido você bater! 🎮 ${LINK}`
    });
    window.scrollTo(0, 0);
  }
  function posicao(k) {
    if (S.modo !== "online") return ""; const lista = rankingDe(k), i = lista.findIndex((x) => x.id === S.uid);
    return i >= 0 ? `<span class="small">Você está em ${i + 1}º no ranking de ${esc(INFO(k).n)}</span>` : "";
  }

  // ---------- aba Galera: chat + quem está online ----------
  function todasMsgs() {
    const ap = new Set(S.mod.apagados || []), out = [];
    for (const [uid, d] of Object.entries(S.chat)) for (const m of (d.msgs || [])) if (m && m.id && !ap.has(m.id) && typeof m.t === "string") out.push({ ...m, uid });
    return out.sort((a, b) => a.ts - b.ts).slice(-120);
  }
  function naoLidas() { const v = Number(LS("flp-chat-visto")) || 0; return todasMsgs().filter((m) => m.ts > v && m.uid !== S.uid).length; }
  function telaGalera() {
    if (S.modo !== "online") { area.innerHTML = `<section class="card"><b class="tit2">💬 Chat da galera</b><p>${FBV ? "O chat é para quem entrou com o Google. Toque em “Entrar com Google” lá em cima." : "O chat é só para quem entrou com a conta Claude pelo convite. Peça o convite ao Márcio e abra este link logado."}</p></section>`; return; }
    const sil = (S.mod.silenciados || []).includes(S.uid);
    area.innerHTML = `<section class="card chat"><div class="chat-top"><b class="tit2">💬 Chat da galera</b><span class="small" id="onl"></span></div>
      <div class="online" id="onlList"></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      ${sil ? `<p class="small" style="color:var(--bad);margin:0">Você está silenciado pelo moderador.</p>` : `<form id="fchat" class="fchat"><input id="chatIn" maxlength="200" placeholder="Mensagem para a galera" autocomplete="off"><button class="bt">Enviar</button></form><span class="small" id="chatErr"></span>`}
      <p class="small" style="margin:0">Respeito sempre. Palavrão vira ★★★, e o moderador pode apagar mensagens e silenciar quem passar do limite.</p></section>`;
    const f = document.getElementById("fchat"); if (f) f.onsubmit = (e) => { e.preventDefault(); enviarMsg(); };
    desenhaMsgs(); desenhaOnline();
  }
  function desenhaOnline() {
    const el = document.getElementById("onlList"), o = document.getElementById("onl"); if (!el) return;
    const vistos = new Map(); for (const p of S.online) if (!vistos.has(p.uid)) vistos.set(p.uid, p);
    o.textContent = vistos.size ? `${vistos.size} online agora` : "";
    el.innerHTML = [...vistos.values()].map((p) => `<span class="on-chip"><i></i>${esc((S.perfis[p.uid]?.apelido) || p.ap || "Alguém")}${p.sala ? ` · ${esc(INFO(p.jogo)?.n || "jogando")}` : ""}</span>`).join("");
  }
  function desenhaMsgs() {
    const el = document.getElementById("msgs"); if (!el) return;
    const fundo = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    const ms = todasMsgs();
    el.innerHTML = ms.length ? ms.map((m) => { const p = S.perfis[m.uid] || {}, eu = m.uid === S.uid;
      return `<div class="msg ${eu ? "eu" : ""}"><span class="m-av">${avMini(p.av)}</span><div class="m-corpo"><b>${esc(p.apelido || "Alguém")}</b> <time>${new Date(m.ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</time><p>${esc(m.t)}</p>${S.dono ? `<div class="m-mod"><button data-m="apagar" data-v="${esc(m.id)}">Apagar</button>${eu ? "" : `<button data-m="silenciar" data-v="${esc(m.uid)}">${(S.mod.silenciados || []).includes(m.uid) ? "Liberar" : "Silenciar"}</button>`}</div>` : ""}</div></div>`; }).join("")
      : `<p class="small" style="text-align:center">Nenhuma mensagem ainda. Mande a primeira!</p>`;
    el.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => b.dataset.m === "apagar" ? modApagar(b.dataset.v) : modSilenciar(b.dataset.v));
    if (fundo || !desenhaMsgs.ja) el.scrollTop = el.scrollHeight; desenhaMsgs.ja = true;
    LS("flp-chat-visto", String(Date.now())); desenhaAbas();
  }
  let ultEnvio = 0, chatSalvando = false;
  async function enviarMsg() {
    const inp = document.getElementById("chatIn"), err = document.getElementById("chatErr"); let t = (inp.value || "").replace(/\s+/g, " ").trim();
    if (!t || chatSalvando) return; if (Date.now() - ultEnvio < 2000) { err.textContent = "Calma! Espere 2 segundos entre mensagens."; return; }
    t = filtra(t).slice(0, 200); ultEnvio = Date.now(); chatSalvando = true;
    const meu = S.chat[S.uid]?.msgs || [], limite = Date.now() - 7 * 864e5;
    const msgs = [...meu.filter((m) => m.ts > limite), { id: S.uid.slice(-6) + Date.now().toString(36), t, ts: Date.now() }].slice(-40);
    try { await S.DB.doc("chat/" + S.uid).set({ msgs }); inp.value = ""; err.textContent = ""; sfx("tap"); }
    catch (e) { err.textContent = "Não deu para enviar agora. Tente de novo."; }
    chatSalvando = false;
  }
  async function modSalvar(m) { try { await S.DB.doc("mod/estado").set(m); } catch (e) { console.warn("mod", e && e.code); } }
  function modApagar(id) { modSalvar({ ...S.mod, apagados: [...(S.mod.apagados || []), id].slice(-400) }); }
  function modSilenciar(uid) { const s = new Set(S.mod.silenciados || []); s.has(uid) ? s.delete(uid) : s.add(uid); modSalvar({ ...S.mod, silenciados: [...s] }); }

  // ---------- aba Ranking ----------
  function rankingDe(k) {
    if (k === "vit") return Object.entries(S.perfis).map(([id, p]) => ({ id, ap: p.apelido, av: p.av, pts: Object.values(p.vit || {}).reduce((a, b) => a + (b || 0), 0) })).filter((x) => x.pts > 0).sort((a, b) => b.pts - a.pts);
    const fonte = S.modo === "online" ? Object.entries(S.perfis) : [["eu", P]];
    return fonte.map(([id, p]) => ({ id, ap: p.apelido || "Você", av: p.av, pts: p.recs?.[k] || 0 })).filter((x) => x.pts > 0 && x.ap).sort((a, b) => b.pts - a.pts);
  }
  function telaRanking() {
    const k = S.rk, lista = rankingDe(k), un = k === "vit" ? "vitórias" : INFO(k).un;
    const pod = lista.slice(0, 3), resto = lista.slice(3, 30);
    const ordemPod = [pod[1], pod[0], pod[2]];
    area.innerHTML = `<section class="card loja">
      <div class="cats">${[...RANK, "vit"].map((r) => `<button class="chip ${r === k ? "sel" : ""}" data-r="${r}">${r === "vit" ? "👑 Campeões" : esc(INFO(r).n)}</button>`).join("")}</div>
      <h2 class="tit" style="text-align:center">${k === "vit" ? "Campeões das salas" : esc(INFO(k).n)}</h2>
      ${k === "vit" ? `<p class="small" style="margin:0;text-align:center">Vitórias em jogos em grupo com 2 ou mais pessoas.</p>` : ""}
      ${lista.length ? `<div class="podio">${ordemPod.map((x, i) => x ? `<div class="pod p${[2, 1, 3][i]} ${x.id === S.uid ? "eu" : ""}"><div class="pod-av">${avMini(x.av)}</div><b>${esc(x.ap)}</b><span>${x.pts} ${un}</span><div class="degrau">${[2, 1, 3][i]}º</div></div>` : `<div></div>`).join("")}</div>
      <ol class="rk" start="4">${resto.map((x) => `<li class="${x.id === S.uid ? "eu" : ""}"><span>${esc(x.ap)}</span><b>${x.pts}</b></li>`).join("")}</ol>`
      : `<p style="text-align:center">Ninguém pontuou ainda. Seja o primeiro!</p>`}
      ${S.modo !== "online" ? `<p class="small">No modo visitante o ranking mostra só você. ${FBV ? "Entrando com o Google" : "Com o convite e o login"}, aparece a galera toda.</p>` : ""}</section>`;
    area.querySelectorAll("[data-r]").forEach((b) => b.onclick = () => { S.rk = b.dataset.r; telaRanking(); });
  }

  // ---------- aba Personagem (loja) ----------
  const CATS = ["cabelo", "corCabelo", "pele", "olhos", "roupa", "corRoupa", "acessorio", "item", "efeito", "cenario"];

  // ---------- utilidades de sorteio ----------
  const rngDe = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

          if (ok) validas[p] = r; }
        const cont = {}; Object.values(validas).forEach((r) => cont[r] = (cont[r] || 0) + 1);
        for (const p of peers) { const pts = validas[p] ? (cont[validas[p]] > 1 ? 5 : 10) : 0; (st.pontosRod[p] = st.pontosRod[p] || []).push(pts); st.placar[p].pts += pts; }
      }
      st.fase = "placar"; prazo(6500);
    },
    receber(peer, d) {
      const st = ENG.st; if (d.rod !== st.rod) return; addJog(peer);
      if (Array.isArray(d.r) && (st.fase === "escrever" || st.fase === "recolher")) ENG.seg.resp[peer] = d.r.slice(0, 6).map((s) => String(s || "").slice(0, 30));
      if (d.stop && st.fase === "escrever") { st.quem = st.placar[peer]?.ap || "Alguém"; st.fase = "recolher"; prazo(2500); hPub(); }
      if (d.voto && st.fase === "votar" && typeof d.voto === "object") ENG.seg.votos[peer] = d.voto;
    },
    loc(st) { const L = ENG.loc; if (L.rod !== st.rod || L.stopSeed !== st.letra) { L.rod = st.rod; L.stopSeed = st.letra; L.r = Array(6).fill(""); L.votos = {}; L.enviado = false; } return L; },
    tela(st) {
      const L = this.loc(st), eu = meuPeer();
      const cab = `<div class="fl-hud"><span>Rodada <b>${st.rod}</b>/3</span><span>Letra <b class="letra">${st.letra}</b></span>${["escrever", "votar"].includes(st.fase) ? `<span>⏱ ${timerHtml()}</span>` : ""}</div>`;
      if (st.fase === "escrever") return `${cab}<div class="stopf">${STOP_CATS.map((c, i) => `<label class="small" for="sc${i}">${c}</label><input id="sc${i}" data-i="${i}" maxlength="30" autocomplete="off" value="${esc(L.r[i])}" placeholder="${st.letra}…">`).join("")}</div><button class="fl-btn stopbt" data-g="stop">✋ STOP!</button>${st.solo ? "" : placarHtml(st)}`;
      if (st.fase === "recolher") { if (!L.enviado) { L.enviado = true; responder({ rod: st.rod, r: L.r }); } return `${cab}<div class="fl-intro"><div class="fl-pts">STOP!</div><p>${st.quem ? `${esc(st.quem)} gritou STOP.` : "O tempo acabou."} Recolhendo respostas…</p></div>`; }
      if (st.fase === "votar" || st.fase === "placar") {
        const peers = Object.keys(st.placar);
        return `${cab}${st.fase === "votar" ? `<p class="small" style="margin:0">Marque ❌ nas respostas que não valem (palavra errada ou que não começa com ${st.letra}). Maioria decide.</p>` : `<p class="small" style="margin:0">Pontos da rodada: válida e só sua 10, repetida 5.</p>`}
          <div class="stopv">${STOP_CATS.map((c, i) => `<div class="sv"><b>${c}</b>${peers.map((p) => { const r = st.resp?.[p]?.[i] || "", k = p + "|" + i, pts = st.pontosRod?.[p]?.[i];
            return `<div class="svr ${p === eu ? "eu" : ""}"><span class="svn">${esc(st.placar[p].ap)}</span><span class="svt">${esc(r) || "—"}</span>${st.fase === "votar" && p !== eu && r ? `<button class="xv ${L.votos[k] ? "on" : ""}" data-g="voto" data-v="${esc(k)}" aria-label="Não vale">❌</button>` : ""}${st.fase === "placar" ? `<em>${pts ?? 0}</em>` : ""}</div>`; }).join("")}</div>`).join("")}</div>${placarHtml(st)}`;
      }
      return "";
    },
    montar(st) { if (st.fase !== "escrever") return; const L = this.loc(st); area.querySelectorAll(".stopf input").forEach((inp) => inp.oninput = () => { L.r[Number(inp.dataset.i)] = inp.value; }); },
    clique(a, v) {
      const st = ultVista, L = this.loc(st);
      if (a === "stop") { if (L.r.filter((x) => x.trim()).length < 3) { const b = area.querySelector(".stopbt"); if (b) b.textContent = "Preencha pelo menos 3!"; return; } L.enviado = true; responder({ rod: st.rod, r: L.r, stop: true }); }
      if (a === "voto") { L.votos[v] = !L.votos[v]; responder({ rod: st.rod, voto: L.votos }); telaJogo(); }
    },
    parcial(a, b) { return b.fase === "escrever" && a.rod === b.rod && !!document.querySelector(".stopf"); }
  };

  // =================== CONEXÃO (login, banco, salas) ===================
  async function conectar() {
    if (!window.claude || !window.claude.use) return;
    S.modo = "carregando"; desenhaJogador();
    const [USER, DB, ROOM] = await Promise.all(["user", "db", "room"].map((n) => window.claude.use(n).catch(() => null)));
    S.USER = USER; S.ROOM = ROOM;
    const uid = USER ? await USER.id() : null;
    if (USER) { S.dono = await USER.isOwner(); const me = await USER.me(); S.nome = me.name || ""; }
    if (!DB || !uid) { S.modo = "local"; desenhaJogador(); render(); ligarSala(); return; }
    S.DB = DB; S.uid = uid;
    if (FBV && window.FB) { FB.registrarConta(); FB.banidos((l) => { S.ban = l; if (l.includes(uid)) { area.innerHTML = `<section class="card"><b class="tit2">Acesso bloqueado</b><p>Sua conta foi bloqueada pelo moderador. Fale com o Márcio.</p></section>`; S.cadastro = false; S.banido = true; document.getElementById("abas").innerHTML = ""; } else if (S.dono && S.tab === "painel" && !ENG.ativo) telaPainel(); }); }
    let meuDoc = null;
    try { meuDoc = await DB.doc("perfis/" + uid).get(); } catch (e) { S.modo = "local"; desenhaJogador(); render(); return; }
    S.modo = "online";
    // primeira vez: o perfil começa com a aura, os itens e os recordes deste celular
    if (meuDoc.exists) { P = { ...PADRAO_P(), ...meuDoc.data(), visto: Date.now() }; salvarPerfil(); }
    else S.cadastro = true;
    DB.collection("perfis").limit(500).onSnapshot((s) => { const m = {}; s.docs.forEach((d) => { if (d.exists) m[d.id] = d.data(); }); S.perfis = m; const r = m[S.uid]; if (r && (r.zerado || 0) > (P.zerado || 0)) { P.recs = {}; P.vit = {}; P.zerado = r.zerado; } if (S.tab === "ranking" && !ENG.ativo && !FL.emJogo()) telaRanking(); if (S.tab === "galera") desenhaMsgs(); if (S.tab === "jogos" && !ENG.ativo && !FL.emJogo() && !S.cadastro) telaJogos(); }, () => {});
    DB.collection("chat").limit(500).onSnapshot((s) => { const m = {}; s.docs.forEach((d) => { if (d.exists) m[d.id] = d.data(); }); S.chat = m; if (S.tab === "galera" && !ENG.ativo) desenhaMsgs(); else desenhaAbas(); }, () => {});
    DB.doc("mod/estado").onSnapshot((d) => { S.mod = d.exists ? { silenciados: [], apagados: [], ...d.data() } : { silenciados: [], apagados: [] }; if (S.tab === "galera" && !ENG.ativo) telaGalera(); if (S.tab === "painel" && !ENG.ativo) telaPainel(); }, () => {});
    desenhaJogador(); render(); ligarSala();
  }
  function ligarSala() {
    const R = S.ROOM; if (!R) return;
    R.onPeers((c) => {
      const ps = c.peers.filter((p) => p.kind === "viewer" && p.presence && p.presence.uid);
      S.online = ps.map((p) => ({ uid: p.presence.uid, ap: String(p.presence.ap || "").slice(0, 16), sala: p.presence.sala, jogo: p.presence.jogo }));
      S.salas = ps.filter((p) => !p.isMe && p.presence.host && p.presence.sala && p.presence.estado === "espera" && GJ[p.presence.jogo]).map((p) => ({ sala: String(p.presence.sala), jogo: p.presence.jogo, ap: String(p.presence.ap || "").slice(0, 16), n: p.presence.n }));
      if (S.tab === "jogos" && !ENG.ativo && !FL.emJogo() && !S.cadastro) telaJogos();
      if (S.tab === "galera") desenhaOnline();
    }, () => {});
    lobbyPresenca();
  }

  window.addEventListener("beforeunload", () => { if (ENG.sala) try { ENG.sala.leave(); } catch (e) {} });

  // ---------- boas-vindas: aparece na primeira visita; o botão "Como funciona?" reabre ----------
  function boasVindas() {
    if (document.getElementById("bvFundo")) return;
    const f = document.createElement("div");
    f.className = "bv-fundo"; f.id = "bvFundo";
    f.innerHTML = `<section class="bv" role="dialog" aria-modal="true" aria-labelledby="bvTit">
      <h2 id="bvTit">Bem-vindo ao Fliperama CIABA! 🎮</h2>
      <div class="bv-it"><span>🕹️</span><p><b>Jogue:</b> Quiz, Tiro Certo, Stop, Forca, Tabuada, Memória e mais. Dá pra jogar sozinho ou em salas ao vivo com a galera.</p></div>
      <div class="bv-it"><span>⚡</span><p><b>Junte aura:</b> toda partida rende aura. Bater recorde e vencer em sala dá bônus.</p></div>
      <div class="bv-it"><span>🎨</span><p><b>Monte seu personagem:</b> na aba Visual, troque sua aura por cabelo, roupas e itens raros.</p></div>
      <div class="bv-it"><span>🏆</span><p><b>Suba no ranking:</b> os melhores aparecem no pódio. Em breve, quem estiver no topo vai concorrer a <b>prêmios</b>.</p></div>
      <p class="bv-reg">🤝 Respeito no chat. Quem pegar pesado é banido.</p>
      <button class="bt" id="bvOk">Bora jogar!</button></section>`;
    document.body.appendChild(f);
    const fechar = () => { LS("fl-boasvindas", "1"); f.remove(); };
    f.querySelector("#bvOk").addEventListener("click", fechar);
    f.addEventListener("click", (e) => { if (e.target === f) fechar(); });
    f.querySelector("#bvOk").focus();
  }
  (function () {
    const cab = document.querySelector(".letreiro"); if (!cab || document.getElementById("bvAbrir")) return;
    const b = document.createElement("button"); b.className = "bv-abrir"; b.id = "bvAbrir"; b.textContent = "Como funciona?";
    b.addEventListener("click", boasVindas); cab.appendChild(b);
  })();
  if (!LS("fl-boasvindas")) boasVindas();
  desenhaJogador(); render(); conectar();
  window.FLON = { S, ENG, get P() { return P; }, JG, registrar, irPara, perguntaTiro, rngDe }; // para testes
})();

</script>
